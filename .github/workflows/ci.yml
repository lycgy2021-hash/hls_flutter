name: Flutter CI

on:
  push:
    branches:
      - main
      - chore/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      - run: flutter --version

      - run: flutter pub get

      - run: dart format -o none --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test
